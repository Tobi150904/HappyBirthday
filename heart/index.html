<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Cốc cốc… bạn có một món quà 🎁</title>
    <meta name="description" content="Có người gửi bạn một tấm thiệp nho nhỏ. Chạm vào để mở xem nhé ❤" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cốc cốc… bạn có một món quà 🎁" />
    <meta property="og:description" content="Có người gửi bạn một tấm thiệp nho nhỏ. Chạm vào để mở xem nhé ❤" />
    <meta property="og:image" content="https://tobi150904.github.io/HappyBirthday/icon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tobi150904.github.io/HappyBirthday/icon.png" />
    <link rel="stylesheet" href="../fonts/heart.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="stage" class="stage">
      <canvas id="scene"></canvas>
      <div id="overlay" class="overlay"></div>

      <div id="hint" class="ah-hint" hidden>Chạm vào trái tim để mở thư 💌</div>

      <audio id="music" loop preload="auto" hidden>
        <source src="./music.mp3" type="audio/mpeg" />
      </audio>

      <button id="musicBtn" type="button" class="ah-music" aria-label="Bật nhạc" aria-pressed="false">
        <svg class="ah-music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V5l10-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="16" cy="16" r="3" />
          <line id="musicSlash" x1="3" y1="3" x2="21" y2="21" />
        </svg>
      </button>

      <div id="letterRoot"></div>
      <div id="photoRoot"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "../vendor/three/build/three.module.js",
          "three/addons/": "../vendor/three/examples/jsm/"
        }
      }
    </script>
    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
