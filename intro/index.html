        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #240000 0, #0a0001 50%, #000 100%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity .8s ease

        #loading-overlay.fade-out {
            opacity: 0;

            display: none
        }

        #loading-overlay .loading-title {
            font-family: Pacifico, Mali, cursive;
            font-size: 42px;
            color: #ff6b8a;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255,107,138,.8),
                0 0 40px rgba(255,107,138,.4),
                0 0 80px rgba(255,107,138,.2);
            animation: loadingFloat 3s ease-in-out infinite;
            padding: 0 20px;
            text-align: center;
            line-height: 1.3
        }

        #loading-overlay .loading-heart {
            font-size: 60px;
            margin-bottom: 25px;
            animation: loadingPulse 1.5s ease-in-out infinite
        }

        #loading-overlay .loading-text {
            font-size: 14px;
            color: rgba(255,255,255,.8);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-family: Mali, sans-serif
        }

        #loading-overlay .loading-bar {
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,.1);
            border-radius: 3px;
            overflow: hidden
        }

        #loading-overlay .loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg,#ff6b8a,#ff8fab);
            border-radius: 3px;
            transition: width .3s ease
        }

        #loading-overlay .loading-percent {
            margin-top: 15px;
            font-size: 12px;
            color: rgba(255,255,255,.6);

        @keyframes loadingFloat {

            0%,100% {

            }

            50% {
                transform: scale(1.2)
            }

        .shooting-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none
        }

        @keyframes shooting-star-opacity {
            0% {
                opacity: 0
            }

            40% {
                opacity: 1
            }

            60% {
                opacity: 1
            }

            100% {
                opacity: 0
            }
        }

        @keyframes shooting-star-pos {
            0% {
                transform: scale(0) rotate(0) translate3d(0,0,0)
            }

            100% {
                transform: scale(1) rotate(0) translate3d(-450px,450px,0)
            }
        }

        .shooting-star {
            display: block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            transform-origin: 100% 0;
            animation:
                shooting-star-opacity 6s infinite ease-in,
                shooting-star-pos 6s infinite ease-in;
            box-shadow: 0 0 8px 3px rgba(255,255,255,.4);
            opacity: 0
        }

        .shooting-star:after {
            content: '';
            display: block;
            position: absolute;
            top: 0;
            left: 3px;
            border: 0 solid #fff;
            border-width: 0 80px 1.5px;
            border-color:
                transparent
                transparent
                transparent
                rgba(255,255,255,.4);
            transform:
                rotate(-45deg)
                translate3d(1px,2px,0);
            box-shadow: 0 0 2px 0 rgba(255,255,255,.2);
            transform-origin: 0% 100%
        }

        .tap-hint {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            animation: fadeInHint 1s ease-out 4s forwards
        }

        .tap-hint-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px
        }

        .tap-hint-icon {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(255,255,255,.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: tapPulse 1.5s ease-in-out infinite;
            background: rgba(255,105,180,.2);
            backdrop-filter: blur(5px)
        }

        .tap-hint-icon::before {
            content: '';
            width: 12px;
            height: 12px;
            background: rgba(255,255,255,.9);
            border-radius: 50%
        }

        .tap-hint-text {
            font-family: Mali, sans-serif;
            font-size: 16px;
            color: rgba(255,255,255,.9);
            text-shadow: 0 2px 10px rgba(0,0,0,.5);
            animation: textGlow 2s ease-in-out infinite
        }

        .tap-hint-arrow {
            font-size: 24px;
            color: rgba(255,255,255,.8);
            animation: bounceArrow 1s ease-in-out infinite
        }

        @keyframes fadeInHint {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0)
            }
        }

        @keyframes tapPulse {
            0%,100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(255,105,180,.4)
            }

            50% {
                transform: scale(1.15);
                box-shadow: 0 0 30px rgba(255,105,180,.7)
            }
        }

        @keyframes textGlow {
            0%,100% {
                text-shadow: 0 2px 10px rgba(255,105,180,.3)
            }

            50% {
                text-shadow: 0 2px 20px rgba(255,105,180,.8)
            }
        }

        @keyframes bounceArrow {
            0%,100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-8px)
            }
        }

        .tap-hint.hidden {
            animation: fadeOutHint .5s ease-out forwards
        }

        @keyframes fadeOutHint {
            from {
                opacity: 1
            }

            to {
                opacity: 0;
                visibility: hidden
            }
        }

        #envelope-overlay {
            position: fixed;
            inset: 0;
            z-index: 519;
            background: 0 0;
            pointer-events: none
        }

        #envelope-overlay.show {
            pointer-events: auto
        }

        #envelope-img {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%) scale(0);
            width: clamp(140px,35vw,250px);
            z-index: 520;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            filter:
                drop-shadow(0 0 30px rgba(255,105,180,.6))
                drop-shadow(0 0 60px rgba(255,20,147,.3));
            -webkit-user-drag: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: filter .3s ease
        }

        #envelope-img.show {
            opacity: 1;
            pointer-events: auto;
            animation: envelopeAppear .8s cubic-bezier(.34,1.56,.64,1) forwards
        }

        #envelope-img.show:hover {
            filter:
                drop-shadow(0 0 40px rgba(255,105,180,.9))
                drop-shadow(0 0 80px rgba(255,20,147,.5))
        }

        #envelope-img.open {
            animation: envelopeOpen .6s ease-in forwards;
            pointer-events: none
        }

        @keyframes envelopeAppear {
            0% {
                transform: translate(-50%,-50%) scale(0) rotate(-15deg);
                opacity: 0
            }

            60% {
                transform: translate(-50%,-50%) scale(1.1) rotate(3deg);
                opacity: 1
            }

            100% {
                transform: translate(-50%,-50%) scale(1) rotate(0);
                opacity: 1
            }
        }

        @keyframes envelopeOpen {
            0% {
                transform: translate(-50%,-50%) scale(1);
                opacity: 1
            }

            50% {
                transform: translate(-50%,-50%) scale(1.2) rotate(5deg);
                opacity: .8
            }

            100% {
                transform: translate(-50%,-50%) scale(.3) rotate(-10deg);
                opacity: 0
            }
        }

                text-align: center;
                border-left: none;
                border-top: 3px solid rgba(200,150,120,.4);
                border-radius: 0 0 10px 10px
            }
        }

        #start-wrap {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition:
                transform .2s ease,
                opacity .5s ease;
            opacity: 0
        }

        #start-wrap.visible {
            display: flex;
            opacity: 1
        }

        #start-wrap.held {
            transform: translateX(-50%) scale(1.08)
        }

        #start-wrap.done {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) scale(.85)
        }

        #start-label {
            font-family: Mali, Pacifico, cursive;
            color: rgba(255,182,193,.95);
            font-size: 15px;
            text-shadow:
                0 0 12px rgba(255,107,138,.7),
                0 0 24px rgba(255,107,138,.4);
            letter-spacing: 1.5px;
            font-weight: 500
        }

        #start-wrap svg {
            width: 74px;
            height: 74px;
            filter: drop-shadow(0 0 12px rgba(255,107,138,.55))
        }

        .ring-pulse {
            fill: rgba(255,107,138,.14);
            animation: ringPulseAnim 2s ease-in-out infinite
        }

        @keyframes ringPulseAnim {
            0%,100% {
                opacity: .65;
                transform-origin: 34px 34px;
                transform: scale(1)
            }

            50% {
                opacity: .2;
                transform-origin: 34px 34px;
                transform: scale(1.08)
            }
        }

        .ring-track {
            fill: none;
            stroke: rgba(255,182,193,.25);
            stroke-width: 3
        }

        .ring-fill {
            fill: none;
            stroke: #ff6b8a;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-dasharray: 163.36;
            stroke-dashoffset: 163.36;
            transform-origin: 34px 34px;
            transform: rotate(-90deg);
            transition: stroke-dashoffset 1s linear
        }

        @media(max-width:768px) {
            #start-wrap {
                bottom: 50px
            }

            #start-label {
                font-size: 13px
            }

            #start-wrap svg {
                width: 66px;
                height: 66px
            }
        }
    </style>
</head>

<body>

    <div id="loading-overlay">
        <div class="loading-title">Đang chuẩn bị yêu thương...</div>
        <div class="loading-heart">💕</div>
        <div class="loading-text">Đang chuẩn bị quà tặng...</div>

        <div class="loading-bar">
            <div class="loading-progress" id="loading-progress"></div>
        </div>

        <div class="loading-percent" id="loading-percent">0%</div>
    </div>

    <div class="tap-hint" id="tapHint" style="display:none">
        <div class="tap-hint-content">
            <div class="tap-hint-arrow">↑</div>
            <div class="tap-hint-text">Chạm vào để xem 💖</div>
            <div class="tap-hint-icon"></div>
        </div>
    </div>

    <div id="start-wrap">
        <div id="start-label">Giữ để bắt đầu</div>

        <svg viewBox="0 0 68 68" aria-hidden="true">
            <circle class="ring-pulse" cx="34" cy="34" r="28"/>
            <circle class="ring-track" cx="34" cy="34" r="26"/>
            <circle class="ring-fill" id="ring-fill" cx="34" cy="34" r="26"/>
        </svg>
    </div>

    <div id="text-container"></div>

    <div class="shooting-stars" id="shooting-stars"></div>

    <audio id="pop-sound">
        <source src="pop.mp3" type="audio/mpeg">
    </audio>

    <audio id="explosion-sound">
        <source src="0206.MP3" type="audio/mpeg">
    </audio>


    <script>
        function decodeData(e) {
            try {
                let a = e
                    .replace(/-/g, "+")
                    .replace(/_/g, "/");

                for (; a.length % 4;) {
                    a += "=";
                }

                const t = atob(a);
                const s = new Uint8Array(t.length);

                for (let e = 0; e < t.length; e++) {
                    s[e] = t.charCodeAt(e);
                }

                const i = pako.inflate(s, {
                    to: "string"
                });

                return JSON.parse(i);

            } catch (e) {
                console.error("Lỗi khi giải mã dữ liệu:", e);
                return null;
            }
        }


        function getUrlParameter(e) {

            const a = new URLSearchParams(window.location.search);
            const t = a.get("c");

            if (t) {

                const a = decodeData(t);

                if (a) {

                    if ("title" === e && a.title)
                        return a.title;

                    if ("music" === e && a.music)
                        return a.music;

                    if ("messages" === e && a.messages)
                        return a.messages;

                    if ("image" === e && a.image)
                        return a.image;

                    if ("popupMessage" === e && a.popupMessage)
                        return a.popupMessage;
                }
            }

            const s = a.get(e);

            return s
                ? decodeURIComponent(s)
                : null;
        }


        /*
         * =========================================================
         * DEFAULT CONFIGURATION
         * =========================================================
         *
         * Đã xóa:
         * - "Gửi Em 💖💕"
         * - "Người Anh Yêu Nhất 💝"
         * - popup "Gửi em — người con gái..."
         *
         * Không còn nội dung mặc định này trong code.
         */

        const defaultData = {
            template: "love",

            data: {

                title: "",

                type_music: "link",

                music_id:
                    "https://cdn.shopify.com/s/files/1/0757/9700/4572/files/tiktok-music-1772796431771-remj7g.mp3?v=1772796434",

                backgroundMusic:
                    "https://cdn.shopify.com/s/files/1/0757/9700/4572/files/tiktok-music-1772796431771-remj7g.mp3?v=1772796434",

                popupMessage: "",

                messages: [],

                images: [
                    "0071.jpeg",
                    "0072.jpeg",
                    "0073.jpeg",
                    "0074.jpeg",
                    "0075.jpeg"
                ]
            }
        };


        const urlParams =
            new URLSearchParams(window.location.search);

        const cfgId =
            urlParams.get("id");

        const urlMusic =
            getUrlParameter("music");

        const urlMessages =
            getUrlParameter("messages");

        const urlImage =
            getUrlParameter("image");

        const urlTitle =
            getUrlParameter("title");

        const urlPopupMessage =
            getUrlParameter("popupMessage");


        /*
         * =========================================================
         * TEMPLATE CONFIGURATION
         * =========================================================
         *
         * Template F đã được làm trống để không tự xuất hiện
         * những câu cũ liên quan đến "em".
         */

        var defaultMessagesF = [];

        var defaultMessagesN = [];


        var templatesF = {
            1: [],
            2: [],
            3: []
        };


        /*
         * Template N giữ nguyên vì đây là chiều ngược lại
         * (nữ -> nam).
         */

        var templatesN = {

            1: [
                "Gửi Anh 💖💕",
                "Người Em Yêu Nhất 💝",
                "Anh Iu Của Em 💖"
            ],

            2: [
                "Anh iu ơi 💗",
                "Có một điều em muốn nói",
                "Cảm ơn anh đã ở bên em",
                "Mãi là cậu nhóc của em 💕"
            ],

            3: [
                "Hey anh iu 💖",
                "Dù xa hay gần",
                "Em vẫn luôn nghĩ về anh",
                "Mở ra xem nhé 💝"
            ]
        };


        function getMessagesByTemplate(e, a) {

            var t =
                "n" === e
                    ? templatesN
                    : templatesF;

            var s =
                "n" === e
                    ? defaultMessagesN
                    : defaultMessagesF;

            return a && t[a]
                ? t[a]
                : s;
        }


        function applyConfig(e) {

            if (e.music) {

                window.dataChristmasTree.data.music_id =
                    e.music;

                window.dataChristmasTree.data.backgroundMusic =
                    e.music;

                window.Heartlove.data.music =
                    e.music;

                if (
                    window.dataValentine &&
                    window.dataValentine.data
                ) {
                    window.dataValentine.data.music =
                        e.music;
                }
            }


            if (
                e.messages &&
                e.messages.length > 0
            ) {

                window.dataChristmasTree.data.messages =
                    e.messages;

                window.Heartlove.data.messages =
                    e.messages;

                if (
                    window.dataValentine &&
                    window.dataValentine.data
                ) {
                    window.dataValentine.data.messages =
                        e.messages;
                }
            }


            if (e.popupMessage) {

                window.dataChristmasTree.data.popupMessage =
                    e.popupMessage;

                window.Heartlove.data.popupMessage =
                    e.popupMessage;
            }


            if (e.titleMessage) {

                var a =
                    document.querySelector(".popup-title");

                if (a) {
                    a.textContent =
                        e.titleMessage;
                }
            }


            if (
                e.images &&
                e.images.length > 0
            ) {

                window.dataChristmasTree.data.images =
                    e.images;

                window.Heartlove.data.images =
                    e.images;

                if (
                    window.dataValentine &&
                    window.dataValentine.data
                ) {
                    window.dataValentine.data.images =
                        e.images;
                }
            }


            window.dispatchEvent(
                new CustomEvent(
                    "configLoaded",
                    {
                        detail: e
                    }
                )
            );
        }


        window.dataChristmasTree = {

            template: defaultData.template,

            data: {

                title:
                    urlTitle ||
                    defaultData.data.title,

                type_music:
                    defaultData.data.type_music,

                music_id:
                    urlMusic ||
                    defaultData.data.music_id,

                backgroundMusic:
                    urlMusic ||
                    defaultData.data.backgroundMusic,

                popupMessage:
                    urlPopupMessage ||
                    defaultData.data.popupMessage,

                messages:
                    urlMessages
                        ? (
                            Array.isArray(urlMessages)
                                ? urlMessages
                                : urlMessages
                                    .split(",")
                                    .map(e => e.trim())
                        )
                        : defaultData.data.messages,

                images:
                    urlImage
                        ? (
                            Array.isArray(urlImage)
                                ? urlImage
                                : urlImage
                                    .split(",")
                                    .map(e => e.trim())
                        )
                        : defaultData.data.images
            }
        };


        window.Heartlove = {

            data: {

                popupMessage:
                    window.dataChristmasTree.data.popupMessage,

                messages:
                    window.dataChristmasTree.data.messages,

                images:
                    window.dataChristmasTree.data.images,

                heartColor:
                    "#fd9595",

                music:
                    window.dataChristmasTree.data.backgroundMusic
            }
        };


        var loadingProgress =
            document.getElementById("loading-progress");

        var loadingPercent =
            document.getElementById("loading-percent");

        var loadingValue = 0;

        var loadingTimer = null;


        function hideLoading() {

            if (loadingTimer) {
                clearInterval(loadingTimer);
            }

            if (loadingProgress) {
                loadingProgress.style.width = "100%";
            }

            if (loadingPercent) {
                loadingPercent.textContent = "100%";
            }

            var e =
                document.getElementById(
                    "loading-overlay"
                );

            if (e) {

                setTimeout(function () {

                    e.classList.add(
                        "fade-out"
                    );

                    setTimeout(function () {

                        e.classList.add(
                            "hidden"
                        );

                    }, 800);

                }, 400);
            }
        }


        if (cfgId) {

            loadingTimer =
                setInterval(function () {

                    if (loadingValue < 90) {

                        loadingValue +=
                            15 * Math.random() + 5;

                        if (loadingValue > 90) {
                            loadingValue = 90;
                        }

                        if (loadingProgress) {

                            loadingProgress.style.width =
                                loadingValue + "%";
                        }

                        if (loadingPercent) {

                            loadingPercent.textContent =
                                Math.round(loadingValue) + "%";
                        }
                    }

                }, 300);
        }


        if (cfgId) {

            fetch(
                "https://lovegift.online/api/settings/" +
                cfgId
            )

                .then(function (e) {
                    return e.json();
                })

                .then(function (e) {

                    if (
                        e.success &&
                        e.data &&
                        e.data.settings
                    ) {

                        var a =
                            e.data.settings;

                        var t = {};


                        if (
                            a.arrayText &&
                            a.arrayText.length > 0
                        ) {
                            t.messages =
                                a.arrayText;
                        }


                        if (a.message) {
                            t.popupMessage =
                                a.message;
                        }


                        if (
                            a.image &&
                            a.image.length > 0
                        ) {
                            t.images =
                                a.image;
                        }


                        if (a.titleMessage) {
                            t.titleMessage =
                                a.titleMessage;
                        }


                        if (a.music) {
                            t.music =
                                a.music;
                        }


                        applyConfig(t);

                        console.log(
                            "Config loaded from API:",
                            t
                        );
                    }


                    hideLoading();

                })

                .catch(function (e) {

                    console.error(
                        "Lỗi load config từ API:",
                        e
                    );

                    hideLoading();
                });

        } else {

            document.addEventListener(
                "DOMContentLoaded",
                function () {

                    var e =
                        document.getElementById(
                            "createTemplateBtn"
                        );

                    if (e) {
                        e.classList.add(
                            "visible"
                        );
                    }
                }
            );

            hideLoading();
        }


        console.log(
            "Dữ liệu đã load:",
            window.Heartlove
        );
    </script>


    <script>
        function createShootingStars() {

            const t =
                document.getElementById(
                    "shooting-stars"
                );

            for (let e = 0; e < 20; e++) {

                const star =
                    document.createElement(
                        "div"
                    );

                star.className =
                    "shooting-star";


                const n =
                    Math.random() *
                    (.8 * window.innerWidth) +
                    .2 * window.innerWidth;

                const o =
                    Math.random() *
                    (.3 * window.innerHeight);


                star.style.left =
                    n + "px";

                star.style.top =
                    o + "px";


                const a =
                    10 * Math.random();

                star.style.animationDelay =
                    a + "s";


                const d =
                    3 + 3 * Math.random();

                star.style.width =
                    d + "px";

                star.style.height =
                    d + "px";


                t.appendChild(star);
            }
        }


        if (
            "loading" ===
            document.readyState
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                createShootingStars
            );

        } else {

            createShootingStars();
        }
    </script>

</body>

</html>
